packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Corepack provides pnpm in this repository; avoid pnpm spawning an unavailable
# global shim while checking dependency state before every workspace script.
verifyDepsBeforeRun: false

allowBuilds:
  "@heroui/shared-utils": false
  "@serialport/bindings-cpp": true
  core-js: false
  esbuild: true
  sharp: false
  unrs-resolver: false
