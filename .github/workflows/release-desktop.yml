name: Release Kontave Desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Verify release identity and signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $desktop = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
          $expectedTag = "desktop-v$($desktop.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Desktop version $($desktop.version). Expected $expectedTag."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD are required; unsigned auto-update artifacts are forbidden."
          }

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify Desktop
        run: |
          corepack pnpm --filter @kontave/desktop typecheck
          corepack pnpm --filter @kontave/desktop test
          corepack pnpm --filter @kontave/desktop build

      - name: Sign and publish installer metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: corepack pnpm --filter @kontave/desktop exec electron-builder --win nsis --publish always
